server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Mesmo padrão do public/.htaccess (Apache): serve arquivo estático se
    # existir, senão manda tudo pro Laravel (SpaController cuida das rotas
    # do SPA e a rota /api das chamadas de API).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # Nega acesso a arquivos ocultos (.env etc.), exceto /.well-known (usado
    # por validação de certificado/domínio)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
